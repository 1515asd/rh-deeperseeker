{% extends "base.html" %}
{% block title %}Вход - DeeperSeeker{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
    <div style="margin-bottom:10px;">
        <input type="text" name="username" placeholder="Имя пользователя" required style="width:300px;">
    </div>
    <div style="margin-bottom:10px;">
        <input type="password" name="password" placeholder="Пароль" required style="width:300px;">
    </div>
    <button type="submit">Войти</button>
</form>
{% endblock %}
