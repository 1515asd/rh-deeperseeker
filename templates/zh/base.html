<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DeeperSeeker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">仪表盘</a>
        <span class="sep">|</span>
        <a href="/logout">退出登录</a>
        <span class="sep">|</span>
        <span class="brand">DeeperSeeker</span>
        <span class="sep">|</span>
        <span class="langnav">
            <a href="/set-lang/en?back={{ request.url.path }}">English</a>
            <span class="sep">|</span>
            <a href="/set-lang/ru?back={{ request.url.path }}">Русский</a>
            <span class="sep">|</span>
            <a href="/set-lang/zh?back={{ request.url.path }}" class="cur">中文</a>
        </span>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
